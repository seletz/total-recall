[tools]
go = "latest"
# The release tool. Pinned: the workflows install the same version
# (scripts/tool-versions-check.sh finds drift).
goreleaser = "2.19.0"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.15.0"
uv = "latest"

[env]
CGO_ENABLED = "0"

[tasks.build]
description = "Build the CLI binary"
run = """
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
go build -ldflags "-s -w -X github.com/seletz/total-recall/internal/version.Version=${VERSION}" -o total-recall ./cmd/total-recall
"""

[tasks."demo:db"]
description = "Build the synthetic demo archive (build/demo.db): the shared fixture of tests and screenshots"
run = "go run ./tools/demo -out build/demo.db"

[tasks."dict:train"]
description = "Train the zstd dictionary for events.raw from synthetic lines (demo archive plus generated records) and write it to internal/store/rawz/dict/raw-v2.zdict (a new dictionary gets a new ID and file; old ones stay for old rows)"
run = "go run ./tools/rawdict train"

[tasks.test]
description = "Run all tests against the prebuilt demo archive"
depends = ["demo:db"]
env = { TOTAL_RECALL_DEMO_DB = "{{config_root}}/build/demo.db" }
run = "go test ./..."

[tasks."test:race"]
description = "Run all tests with the race detector (needs cgo on linux)"
depends = ["demo:db"]
env = { CGO_ENABLED = "1", TOTAL_RECALL_DEMO_DB = "{{config_root}}/build/demo.db" }
run = "go test -race -timeout 20m ./..."

[tasks.lint]
description = "Run go vet and golangci-lint"
run = ["go vet ./...", "golangci-lint run"]

[tasks."tools:check"]
description = "Check that the workflows pin the goreleaser and cyclonedx-gomod versions of mise.toml and install cosign before goreleaser (CI runs this)"
run = "scripts/tool-versions-check.sh"

[tasks.release]
description = "Create a new release (interactive semver bump, pushes the tag)"
run = "scripts/release.sh"

[tasks."release:notes:check"]
description = "Test scripts/release-notes.sh against the synthetic changelog in scripts/testdata (part of `go test ./...`, so CI runs it)"
run = "go test ./scripts"

[tasks."release:snapshot"]
description = "Build a snapshot release into dist/ with goreleaser: archives, SBOMs and checksums as the release workflow would, nothing published"
# The SBOM generator is pinned here, not under [tools]: only the release
# needs it. The workflows install the same version; `mise run tools:check`
# finds drift.
tools = { "github:CycloneDX/cyclonedx-gomod" = "1.12.0" }
run = "goreleaser release --snapshot --clean"

[tasks."sbom:check"]
description = "Build a snapshot release and check its SBOMs: one per archive, listed in the checksums, modules and hashes as in go.sum (CI runs this)"
depends = ["release:snapshot"]
run = "go run ./tools/sbom check dist"

[tasks."uv:sync"]
description = "Install the docs toolchain (Zensical) into .venv"
run = "uv sync --locked"

[tasks."docs:serve"]
description = "Serve documentation locally with live reload"
depends = ["uv:sync"]
run = "uv run --locked zensical serve --open"

[tasks."docs:screenshots"]
description = "Render the TUI screenshots for the docs from the demo archive and update the goldens of the screenshot tests"
depends = ["demo:db"]
run = "go run ./tools/screenshots -db build/demo.db -out docs/assets/screenshots -golden internal/screenshot/testdata/frames"

[tasks."docs:screenshots:check"]
description = "Check that the committed TUI screenshots and goldens match a fresh render; fails with a hint otherwise (CI runs this)"
depends = ["demo:db"]
run = "scripts/screenshots-check.sh -db build/demo.db"

[tasks."docs:charts"]
description = "Render the figures of `total-recall chart` for the docs from the demo archive (docs/assets/charts)"
depends = ["demo:db"]
run = "go run ./tools/charts -db build/demo.db -out docs/assets/charts"

[tasks."docs:charts:check"]
description = "Check that the committed figures of the docs match a fresh render; fails with a hint otherwise (CI runs it)"
depends = ["demo:db"]
run = "scripts/charts-check.sh -db build/demo.db"

[tasks."docs:build"]
description = "Build documentation site (strict)"
depends = ["uv:sync"]
run = "uv run --locked zensical build --clean --strict"
