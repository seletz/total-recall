name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cyclonedx-gomod
        # The SBOM generator goreleaser calls through tools/sbom. Same version
        # as the pin in mise.toml (task release:snapshot);
        # scripts/tool-versions-check.sh finds drift.
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0

      # The section "## <tag>" of docs/reference/90-aenderungen.md becomes the head of the
      # release body; goreleaser appends its commit changelog below it. A tag
      # without a section fails here, before anything is published.
      - name: Extract release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-header.md"

      - name: Install cosign
        # Lets goreleaser-action verify the sigstore signature of the
        # goreleaser download (cosign verify-blob on checksums.txt); without
        # cosign in PATH the action only checks the checksum and logs
        # "cosign not found in PATH, skipping signature verification". A
        # failed verification fails the step and with it the run.
        uses: sigstore/cosign-installer@v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          # Pinned to the version in mise.toml; scripts/tool-versions-check.sh
          # (CI step "Check the tool versions") fails when the two drift.
          version: v2.19.0
          args: release --clean --release-header ${{ runner.temp }}/release-header.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # macOS signing and notarization (notarize.macos in .goreleaser.yml).
          # Without MACOS_SIGN_P12 the step is skipped and the darwin binaries
          # ship unsigned. Setup: docs/reference/50-release.md.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
