name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        # The race detector needs cgo on linux; the build stays static.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          # Build with the setup-go toolchain so the linter's Go version is
          # never older than the one go.mod targets.
          install-mode: goinstall

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install docs toolchain
        run: uv sync --locked

      - name: Build docs (strict)
        # Same command as `mise run docs:build`; the deploy lives in docs.yml.
        run: uv run --locked zensical build --clean --strict
