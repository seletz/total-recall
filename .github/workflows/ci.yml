name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: Build the demo archive
        # Same command as `mise run demo:db`; the tests that need a
        # populated archive read it through TOTAL_RECALL_DEMO_DB.
        run: go run ./tools/demo -out build/demo.db

      - name: Check the TUI screenshots
        # Same command as `mise run docs:screenshots:check`, restricted to the
        # text frames: renders the screenshots into a temporary directory and
        # fails when the committed goldens are stale. The images are not
        # compared here because the font rasterizer rounds a few pixels
        # differently on amd64 than on the arm64 Macs that render them.
        run: scripts/screenshots-check.sh -db build/demo.db --goldens-only

      - name: Check the figures of the docs
        # Same command as `mise run docs:charts:check`: renders the SVG
        # figures of `total-recall chart` into a temporary directory and
        # fails when the committed files in docs/assets/charts/ are stale.
        run: scripts/charts-check.sh -db build/demo.db

      - name: go test
        # The race detector needs cgo on linux; the build stays static.
        env:
          CGO_ENABLED: "1"
          TOTAL_RECALL_DEMO_DB: ${{ github.workspace }}/build/demo.db
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          # Build with the setup-go toolchain so the linter's Go version is
          # never older than the one go.mod targets.
          install-mode: goinstall

      - name: Check the tool versions
        # Same command as `mise run tools:check`: the workflows pin the
        # goreleaser and cyclonedx-gomod versions of mise.toml and install
        # cosign before goreleaser-action.
        run: scripts/tool-versions-check.sh

      - name: Install cosign
        # Lets goreleaser-action verify the sigstore signature of the
        # goreleaser download (cosign verify-blob on checksums.txt); without
        # cosign in PATH the action only checks the checksum and logs
        # "cosign not found in PATH, skipping signature verification". A
        # failed verification fails the step and with it the run.
        uses: sigstore/cosign-installer@v4.1.2

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          # Pinned to the version in mise.toml; scripts/tool-versions-check.sh
          # (CI step "Check the tool versions") fails when the two drift.
          version: v2.19.0
          args: check

  # Same commands as `mise run sbom:check`: a snapshot release into dist/
  # (nothing is published) and the check of its SBOMs. The release workflow
  # runs the identical goreleaser config, so what passes here ships.
  release-snapshot:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cyclonedx-gomod
        # Same version as the pin in mise.toml (task release:snapshot);
        # scripts/tool-versions-check.sh finds drift.
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0

      - name: Install cosign
        # Lets goreleaser-action verify the sigstore signature of the
        # goreleaser download (cosign verify-blob on checksums.txt); without
        # cosign in PATH the action only checks the checksum and logs
        # "cosign not found in PATH, skipping signature verification". A
        # failed verification fails the step and with it the run.
        uses: sigstore/cosign-installer@v4.1.2

      - name: goreleaser snapshot
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          # Pinned to the version in mise.toml; scripts/tool-versions-check.sh
          # (CI step "Check the tool versions") fails when the two drift.
          version: v2.19.0
          args: release --snapshot --clean

      - name: Check the SBOMs
        run: go run ./tools/sbom check dist

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install docs toolchain
        run: uv sync --locked

      - name: Build docs (strict)
        # Same command as `mise run docs:build`; the deploy lives in docs.yml.
        run: uv run --locked zensical build --clean --strict
