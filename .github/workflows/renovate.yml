name: Renovate

# Self-hosted Renovate: opens PRs for outdated Go modules, GitHub Actions and
# mise tools (see renovate.json5).
#
# Token: RENOVATE_TOKEN is a fine-grained personal access token stored as the
# repository secret RENOVATE_TOKEN, with read and write access to Contents,
# Pull requests, Issues and Workflows. A PAT is needed because PRs opened with
# the GITHUB_TOKEN do not trigger other workflows (CI would never run on the
# update PRs) and because the GITHUB_TOKEN cannot change files under
# .github/workflows.

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: log the planned changes, create no branches or PRs"
        type: boolean
        default: false
      log_level:
        description: "Renovate log level"
        type: choice
        options:
          - info
          - debug
        default: info

# Never run two Renovate jobs at once, and let a running one finish.
concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Renovate
        # v46.3.14
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774
        with:
          configurationFile: renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || 'null' }}
