# total-recall configuration
#
# Location: ~/.config/total-recall/config.toml ($XDG_CONFIG_HOME is honoured),
# override with --config or TOTAL_RECALL_CONFIG.
# Precedence: flag > environment variable > this file > built-in default.
# "~" and environment variables ($VAR, ${VAR}) are expanded in paths.
# Unknown keys are an error, so typos do not go unnoticed.
# `total-recall config show` prints the effective values and where each came from.

# Path of the archive database. Default:
#   macOS: ~/Library/Application Support/total-recall/archive.db
#   Linux: $XDG_DATA_HOME/total-recall/archive.db (~/.local/share/...)
# Keep it out of iCloud/Dropbox: SQLite WAL files and sync do not mix.
# Override: --db, TOTAL_RECALL_DB.
# db = "~/Library/Application Support/total-recall/archive.db"

# Time zone for evaluations (stats, day boundaries). Override: --tz.
timezone = "Europe/Berlin"

# Wall-clock time at which a day begins for the first/last activity per day
# (`stats --workday`, TUI view "activity"): activity before it, e.g. at 01:30,
# counts for the previous day and is shown as "01:30 (+1)".
day_start = "04:00"

# Log file for hook errors. Empty = total-recall.log next to the database.
log = ""

[backup]
# Target directory for `total-recall backup` (gzip-compressed archive-YYYY-MM-DD.db.gz).
# Override: --backup-dir, TOTAL_RECALL_BACKUP_DIR.
dir = "~/Documents/total-recall"
# Number of most recent daily copies to keep.
keep_daily = 7
# Number of monthly copies (newest file per month) to keep; 0 = keep all.
keep_monthly = 0
# Minimum age of the last backup for `backup --if-older` when no duration is given.
min_interval = "24h"

[redact]
# Mask secrets in text and raw JSON before they are stored.
enabled = true
# Additional Go regular expressions to mask. With a capture group only group 1 is masked.
extra_patterns = []
# Go regular expressions; a candidate secret matching one of them is never masked.
allow = []

[ingest]
# Tool results are truncated to this many bytes.
tool_result_max_bytes = 4096
# Keep the (redacted) original JSON line of every event.
store_raw = true
# Lines longer than this many bytes are not kept as raw JSON (raw = NULL,
# raw_truncated = 1); the event text is stored as usual. 0 = no limit.
raw_max_bytes = 16384

[harness.claude]
enabled = true
# Default: $CLAUDE_CONFIG_DIR/projects or ~/.claude/projects.
# projects_dir = "~/.claude/projects"
# Record types to skip in addition to the built-in exclusions.
skip_record_types = []

[harness.claude.actors]
# Additional message prefixes for actor classification.
peer_prefixes = []
# A message that is exactly one pasted block whose first line starts with
# one of these is a task from another agent ("peer"), e.g. ["# Task:", "Auftrag:"].
peer_paste_headers = []
automation_prefixes = ["Hourly ", "Weekend watch"]

[work]
# Normal working time for the activity per day (`stats --workday`, TUI view
# "activity"). Core hours as HH:MM-HH:MM (local time, not before day_start):
# activity outside them is marked as early or late.
hours = "09:00-17:00"
# Daily target on weekdays; the difference per day and the balance of a
# week or month are measured against it. Weekends have no target.
target = "8h"
# A day's span (first to last activity) below daily_low counts as under,
# above daily_high as over the target; in between it is on target.
daily_low = "6h"
daily_high = "9h"
# The working time of a week with five workdays below weekly_low counts as
# under, above weekly_high as over the target. A week or a month with fewer
# workdays (holidays, the running period) scales the bounds.
weekly_low = "32h"
weekly_high = "48h"
# Bundesland for the public holidays (no target, named in the views):
# Baden-Württemberg, Bayern, Berlin, Brandenburg, Bremen, Hamburg, Hessen,
# Mecklenburg-Vorpommern, Niedersachsen, Nordrhein-Westfalen, Rheinland-Pfalz,
# Saarland, Sachsen, Sachsen-Anhalt, Schleswig-Holstein, Thüringen or
# Deutschland (nationwide only); an unknown name means Deutschland.
bundesland = "Baden-Württemberg"
# Which events the activity per day counts by default: "human" (own messages
# only; agent events run on at night and stretch the span) or "all" (human
# and agent events). stats --workday --all-events and the key h in the TUI
# switch for one run.
count = "human"

[worktime]
# Working time per project and day, estimated from your own messages
# (`stats --worktime`), as a basis for timesheets. The gap between two
# consecutive own messages, across all sessions, counts for the project of
# the later one: in full up to max_gap, otherwise (a break, a meeting, the
# first message of a day) min_credit. Meetings and work without an agent
# leave no messages: the values are a lower bound.
max_gap = "20m"
min_credit = "3m"
# The sum per category and day is rounded to grid (0 = no rounding), in the
# direction rounding: up, down or nearest.
grid = "15m"
rounding = "up"
# What is rounded: "category" (the sum of a category per day, once) or
# "project" (every project per day; the category is the sum of its
# rounded projects).
scope = "category"
# Length of the booking text per category and day that `--summary` builds
# from the session titles and the issue/PR references in your messages;
# 0 = no limit.
summary_max_chars = 200
# Categories, as an ordered list of rules; the first rule with a matching
# pattern wins. A pattern is matched whole against the project name (as in
# `stats --by project`), the git root or working directory (as a path and
# with the home directory as "~") and the remote URL; "*" matches anything,
# also "/", "?" one character. A project no rule matches is its own
# category, named like the project; a last rule with "*" collects the rest.
# color is the colour of the category in the charts (`total-recall chart
# worktime`): blue, orange, green, red, purple, teal or "#rrggbb"; without
# one the charts pick the next free colour.
# [[worktime.category]]
# name = "kunde-a"
# match = ["https://github.com/kunde-a/*", "~/src/kunde-a-*"]
# color = "blue"
# [[worktime.category]]
# name = "sonstiges"
# match = "*"

[git]
# Resolve git root, remote URL and branch for session working directories.
resolve = true

# Projects, as an ordered list of definitions; the first definition with a
# matching pattern wins. A pattern is matched whole against the git root or
# working directory of a session (as a path and with the home directory as
# "~"), its remote URL and the project name it would get without
# definitions (the base name of the git root); "*" matches anything, also
# "/", "?" one character. Sessions no definition matches keep that derived
# name, so without definitions nothing changes. Several repositories with
# the same definition are one project in `stats --by project`,
# `stats --worktime` (the category rules see the project name) and the TUI.
# color is a palette name (blue, orange, green, red, purple, teal) or
# "#rrggbb"; without one the project takes the next free palette colour.
# [[project]]
# name = "kompass"
# description = "Wanderkarten, alle Repositories"
# color = "blue"
# match = ["https://github.com/mara/kompass*", "~/src/kompass-*"]
# [[project]]
# name = "notizbox"
# match = "~/notes"

# Names for the account and organization IDs of the sessions (Claude Code
# writes them since 2.1.317). `sessions --account NAME`, `stats --by account`
# and `show` use the names; IDs without a name are shown as they are.
# [accounts]
# "aaaaaaaa-0000-4000-8000-000000000001" = "work"
# "bbbbbbbb-0000-4000-8000-000000000002" = "private"

[tui]
# Start-up defaults of `total-recall tui`; flags and the view argument
# override them.
# View shown first: search, stats or activity.
view = "search"
# Chart rendering in the stats view: auto, text or kitty (--graphics).
graphics = "auto"
# Wheel scrolling and clicks; false leaves the mouse to the terminal
# (--no-mouse, --no-mouse=false switches it on for one run).
mouse = true
# Period (day, week, month) and dimension (project, agent, directory) the
# stats view starts with.
stats_period = "day"
stats_dimension = "project"
# Window the activity view starts with: day, week or month.
activity_window = "week"
# Colour the bars of the activity view by project from the start (the key
# p switches between the working hours and the projects).
activity_projects = false
# How often the TUI checks the archive for changes and reloads the visible
# view when there are any (--reload); 0 switches it off, at least 1s.
reload = "5s"

[chart]
# Defaults of `total-recall chart` (figures for monthly reports); flags
# override them.
# Output format: svg or png (--format).
format = "svg"
# Size factor of the PNG and of the width/height of the SVG (--scale);
# --width or --height set the size instead.
scale = 1.0
# Heading and legend (--no-title, --no-legend switch them off for one run).
title = true
legend = true
# Leave the white background out (--transparent).
transparent = false
# Projects in the project chart; the rest is folded into "other" (--top,
# 0 = all).
top = 12
# Colour scale of the calendar, light to dark, one colour per level:
# blue, orange, green, red, purple, teal or "#rrggbb".
heatmap = ["#c6dbef", "#9ecae1", "#4292c6", "#08519c"]

[keys]
# Key bindings of the TUI: action = key or list of keys. Only listed
# actions change; the docs (TUI, "Tastenbelegung anpassen") list every
# action with its default. Names are prefixed with the view they belong
# to; a key may belong to one action per view, and global keys to none.
# Key names: single characters ("a", "G", "?", ","), up, down, left,
# right, enter, tab, esc, space, backspace, delete, insert, home, end,
# pgup, pgdown, f1-f20, with ctrl+, alt+ and shift+ in front; ctrl+c always
# quits and cannot be bound.
# Examples:
# global_quit = ["q", "ctrl+q"]
# stats_earlier = "<"
# stats_later = ">"
