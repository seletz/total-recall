version: 2

project_name: total-recall

before:
  hooks:
    - go mod tidy
    - ./scripts/completions.sh
    # The web UI (web/, spike #171) is built once here and embedded into
    # every binary; Node is needed on the release runner, not at run time.
    - npm ci --prefix web
    - npm run build --prefix web

builds:
  - id: total-recall
    main: ./cmd/total-recall
    binary: total-recall
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/seletz/total-recall/internal/version.Version={{.Version}}

# Sign and notarize the darwin binaries (Developer ID Application, hardened
# runtime, Apple timestamp) with quill; it runs on the Linux release runner, no
# macOS needed. The step is part of goreleaser's build pipeline and rewrites the
# binaries in dist/ in place before archives, SBOMs and checksums are made, so
# all three describe the signed binary. It is only active when the maintainer
# set the secrets (release.yml passes them through); snapshot builds, CI and
# forks without secrets build unsigned binaries as before. Notarization of a
# bare Mach-O cannot be stapled: Gatekeeper fetches the ticket from Apple on
# first launch. How to set up the secrets and check a release:
# docs/reference/50-release.md.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - total-recall
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        # Wait for Apple's verdict so a rejected submission fails the release
        # before anything is uploaded. 20m is the maximum goreleaser allows.
        wait: true
        timeout: 20m

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    files:
      - completions/*

# One CycloneDX SBOM per platform next to the archive, cataloged from the
# released binary itself (the linked modules differ per platform). tools/sbom
# runs the pinned cyclonedx-gomod (mise.toml), names the main component after
# the project and checks the document before goreleaser checksums and uploads
# it; the checksum file lists the SBOMs like the archives. goreleaser runs the
# command inside dist/, hence the relative paths.
sboms:
  - id: binary
    artifacts: binary
    documents:
      - "{{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}.cdx.json"
    cmd: go
    args:
      - run
      - ../tools/sbom
      - generate
      - -sum
      - ../go.sum
      - -binary
      - $artifact
      - -out
      - $document
      - -goos
      - "{{ .Os }}"
      - -goarch
      - "{{ .Arch }}"
      - -version
      - "{{ .Version }}"

checksum:
  name_template: "checksums-{{ .Tag }}.txt"

# The release body starts with the notes for the tag from docs/reference/90-aenderungen.md
# (scripts/release-notes.sh, passed as --release-header by the workflow); the
# generated changelog below lists the remaining commits.
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto

homebrew_casks:
  - name: total-recall
    # Without the tap token (secret not set yet) the cask is not pushed; the GitHub release still happens.
    skip_upload: "{{ if not (index .Env \"HOMEBREW_TAP_GITHUB_TOKEN\") }}true{{ else }}false{{ end }}"
    binaries:
      - total-recall
    repository:
      owner: seletz
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Update {{ .ProjectName }} to {{ .Tag }}"
    directory: Casks
    homepage: "https://github.com/seletz/total-recall"
    license: "MIT"
    description: "Archive coding-agent sessions into a local SQLite database"
    completions:
      bash: completions/total-recall.bash
      zsh: completions/_total-recall
      fish: completions/total-recall.fish
