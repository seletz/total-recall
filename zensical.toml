[project]
site_name = "total-recall"
site_description = "Archiv für Sessions von Coding-Agenten in einer lokalen SQLite-Datenbank."
site_author = "Stefan Eletzhofer"
site_url = "https://seletz.github.io/total-recall/"
repo_url = "https://github.com/seletz/total-recall"
copyright = "Copyright &copy; 2026 Stefan Eletzhofer"

# Strict: tote interne Links und kaputte Anker brechen den Build, statt nur
# zu warnen. Was lokal grün ist, bleibt auch in der CI grün.
strict = true

# Kein explizites `nav`: die Sidebar ist ordnergetrieben aus den vier
# Diátaxis-Ordnern docs/tutorials, docs/how-to, docs/reference und
# docs/explanation. Jeder Ordner trägt eine index.md als Landing-Page
# (`navigation.indexes`), die auch den Abschnittstitel liefert
# (`section_renamed`) und über `weight:` die Reihenfolge der Quadranten
# (Tutorials, How-To, Referenz, Erklärungen). Seiten sind nach Dateiname
# sortiert; Zahlenpräfixe, wo die Reihenfolge zählt.

# Zensical replaces (does not merge) the default extension list when this key
# is set, so everything in use is listed explicitly.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
"pymdownx.betterem" = {}
"pymdownx.details" = {}
"pymdownx.inlinehilite" = {}
"pymdownx.keys" = {}
"pymdownx.magiclink" = {}
"pymdownx.mark" = {}
"pymdownx.smartsymbols" = {}
"pymdownx.tasklist" = { custom_checkbox = true }

[project.markdown_extensions.toc]
permalink = true

# Icons im Text (:lucide-wrench:, :octicons-arrow-right-24:) für die Karten
# der Startseite.
[project.markdown_extensions."pymdownx.emoji"]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true
combine_header_slug = true

[project.theme]
language = "de"
# No instant navigation: Safari leaves the address bar on the old URL after
# history.pushState (see sichtung#523).
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "navigation.footer",
    "navigation.indexes",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Dunkles Design"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Helles Design"

[project.theme.icon]
logo = "lucide/archive"

# Abschnittstitel aus der index.md des Ordners („Referenz“ statt „Reference“).
[project.plugins."mkdocs-nav-weight"]
section_renamed = true
